<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BKSMM - Login</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{--bg:#0b1220;--card:#111a2e;--line:#1f2b46;--txt:#e5e7eb;--mut:#94a3b8;--acc:#05a6f3}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 30% 0%,#12305a,var(--bg) 60%);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
  .card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px}
  h1{margin:0 0 4px;font-size:26px;letter-spacing:.5px}
  .sub{color:var(--mut);font-size:14px;margin-bottom:20px}
  .tabs{display:flex;background:#0b1426;border-radius:10px;padding:4px;margin-bottom:18px}
  .tabs button{flex:1;border:0;background:none;color:var(--mut);padding:10px;border-radius:8px;font-size:15px;cursor:pointer}
  .tabs button.on{background:var(--acc);color:#fff}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
  input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#0b1426;color:var(--txt);font-size:15px}
  input:focus{outline:2px solid var(--acc);border-color:transparent}
  .go{width:100%;margin-top:18px;padding:13px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
  .go:disabled{opacity:.6}
  .err{color:#fca5a5;font-size:14px;min-height:20px;margin-top:12px}
  .or{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:20px 0 14px}
  .or:before,.or:after{content:"";flex:1;height:1px;background:var(--line)}
  #g{display:flex;justify-content:center;min-height:44px}
  .hide{display:none}
  .note{color:var(--mut);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <h1>BKSMM</h1>
  <div class="sub">India's Telegram SMM Panel</div>
  <div class="tabs">
    <button id="tLogin" class="on" type="button">Login</button>
    <button id="tSignup" type="button">Sign up</button>
  </div>

  <form id="fLogin" autocomplete="on">
    <label for="lu">Username ya email</label>
    <input id="lu" name="username" autocomplete="username" required>
    <label for="lp">Password</label>
    <input id="lp" name="password" type="password" autocomplete="current-password" required>
    <button class="go" type="submit">Login</button>
    <p class="note" style="margin-top:12px"><a href="#" id="toForgot" style="color:var(--acc)">Username ya password bhool gaye?</a></p>
  </form>

  <form id="fForgot" class="hide" autocomplete="on">
    <p class="note" style="text-align:left;margin:0 0 4px">Apna registered email daalo. Hum reset link aur tumhara username mail kar denge.</p>
    <label for="fe">Email (Gmail)</label>
    <input id="fe" name="email" type="email" autocomplete="email" required>
    <button class="go" type="submit">Reset link bhejo</button>
    <p class="note" style="margin-top:12px"><a href="#" id="toLogin" style="color:var(--acc)">← Login par wapas</a></p>
  </form>

  <form id="fSignup" class="hide" autocomplete="on">
    <label for="su">Username</label>
    <input id="su" name="username" autocomplete="username" minlength="3" maxlength="24" required>
    <label for="se">Email</label>
    <input id="se" name="email" type="email" autocomplete="email" required>
    <label for="sp">Password (kam se kam 8 characters)</label>
    <input id="sp" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required>
    <button class="go" type="submit">Create account</button>
  </form>

  <div class="err" id="err" role="alert"></div>

  <div id="gWrap" class="hide">
    <div class="or">ya</div>
    <div id="g"></div>
  </div>
  <p class="note" style="margin-top:18px">Add funds ke liye: @Mbbsloverr</p>
</div>

<script>
const $ = id => document.getElementById(id);
const err = m => $('err').textContent = m || '';
function show(which){
  const s = which === 'signup', f = which === 'forgot';
  $('fLogin').classList.toggle('hide', s || f); $('fSignup').classList.toggle('hide', !s); $('fForgot').classList.toggle('hide', !f);
  $('tLogin').classList.toggle('on', !s); $('tSignup').classList.toggle('on', s);
  $('gWrap').style.display = f ? 'none' : '';
  err('');
}
$('tLogin').onclick = () => show('login');
$('tSignup').onclick = () => show('signup');
$('toForgot').onclick = e => { e.preventDefault(); show('forgot'); };
$('toLogin').onclick = e => { e.preventDefault(); show('login'); };
if (location.hash === '#signup') show('signup');

async function post(url, body){
  const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Kuch galat hua.');
  return j;
}
function wire(formId, url){
  $(formId).addEventListener('submit', async e => {
    e.preventDefault(); err('');
    const btn = e.target.querySelector('.go'); btn.disabled = true;
    try { await post(url, Object.fromEntries(new FormData(e.target))); location.href = '/'; }
    catch (x) { err(x.message); btn.disabled = false; }
  });
}
wire('fLogin', '/auth/login');
wire('fSignup', '/auth/signup');
$('fForgot').addEventListener('submit', async e => {
  e.preventDefault(); err('');
  const btn = e.target.querySelector('.go'); btn.disabled = true;
  try { const j = await post('/auth/forgot', {email: $('fe').value}); $('err').style.color = '#86efac'; err(j.message); }
  catch (x) { $('err').style.color = ''; err(x.message); }
  btn.disabled = false;
});

// Google
fetch('/auth/config').then(r => r.json()).then(cfg => {
  if (!cfg.googleClientId) return;
  $('gWrap').classList.remove('hide');
  const init = () => {
    if (!window.google || !google.accounts) return setTimeout(init, 150);
    google.accounts.id.initialize({
      client_id: cfg.googleClientId,
      callback: async resp => {
        try { await post('/auth/google', {credential: resp.credential}); location.href = '/'; }
        catch (x) { err(x.message); }
      }
    });
    google.accounts.id.renderButton($('g'), {theme:'filled_blue', size:'large', text:'continue_with', width:320});
  };
  init();
});
</script>
</body>
</html>
